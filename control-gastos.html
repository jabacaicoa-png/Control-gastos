<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#217346"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Control de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',sans-serif;font-size:13px;font-weight:700;}
body{background:#EBEBEB;min-height:100vh;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input{font-family:'Roboto',sans-serif!important;font-size:13px!important;font-weight:700!important;text-transform:uppercase;}
input[type=number]{text-transform:none;}
::-webkit-scrollbar{height:4px;width:4px;}
::-webkit-scrollbar-thumb{background:#AAA;border-radius:3px;}
.ribbon{background:#217346;height:40px;display:flex;align-items:center;padding:0 10px;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.3);position:sticky;top:0;z-index:100;}
.ribbon-title{color:white;font-weight:700;font-size:14px;letter-spacing:1px;white-space:nowrap;}
.nav-btn{background:#1a5c38;border:1px solid #145029;color:white;font-size:13px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-mes{background:white;color:#217346;font-weight:700;font-size:13px;padding:2px 8px;min-width:110px;text-align:center;}
.gdrive-bar{background:#F2F2F2;border-bottom:1px solid #CCC;padding:5px 10px;display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:99;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.gbtn{color:white;border:none;padding:0;font-size:13px;font-family:'Roboto',sans-serif;cursor:pointer;border-radius:6px;white-space:nowrap;width:60px;height:36px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4),0 4px 6px rgba(0,0,0,.28),inset 0 -2px 3px rgba(0,0,0,.18);transition:transform .08s ease,box-shadow .08s ease;-webkit-tap-highlight-color:transparent;transform:translateY(0);}
.gbtn::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.15) 100%);}
.gbtn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.25),inset 0 2px 3px rgba(0,0,0,.25);}
.gbtn:disabled,.gbtn[disabled]{opacity:.6;box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 -1px 2px rgba(0,0,0,.15);}
.gbtn.blue{background:#4285F4;}.gbtn.green{background:#217346;}.gbtn.navy{background:#1F3864;}
.tab-bar{background:#BFBFBF;display:flex;align-items:flex-end;padding-left:10px;border-bottom:2px solid #9E9E9E;}
.tab{background:white;border:1px solid #9E9E9E;border-bottom:none;padding:3px 14px;font-size:13px;font-weight:700;color:#217346;cursor:pointer;}
.content{padding:10px;overflow-x:auto;}
.block{display:inline-block;background:white;border:2px solid #9E9E9E;margin-bottom:12px;box-shadow:2px 2px 0 #C5C5C5;min-width:100%;}
.ph{background:#1F3864;padding:5px 10px;color:white;font-weight:700;font-size:15px;letter-spacing:1px;}
.row{display:flex;border-bottom:1px solid #D0D0D0;}
.cell{display:flex;align-items:center;overflow:hidden;border-right:1px solid #D0D0D0;min-height:28px;flex-shrink:0;}
.cell.grow{flex:1;min-width:0;flex-shrink:1;}
.cell:last-child{border-right:none;}
.cv{font-size:13px;font-weight:700;padding:0 5px;min-height:30px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:cell;width:100%;}
.cv input{width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;font-weight:700;padding:0 5px;height:30px;}
.lbl{font-size:13px;font-weight:700;padding:2px 8px;min-height:30px;display:flex;align-items:center;}
.val{font-size:13px;font-weight:700;padding:0 5px;min-height:30px;display:flex;align-items:center;}
.th{font-size:13px;font-weight:700;color:#333;padding:2px 5px;white-space:nowrap;width:100%;text-align:left;}
.btn-rep{width:26px;min-height:30px;cursor:pointer;color:#1565C0;font-size:15px;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-del{width:26px;min-height:30px;cursor:pointer;color:#C00000;font-size:15px;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-ord{flex:1;cursor:pointer;color:#AAA;font-size:13px;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:30px;background:white;border:none;padding:0;}
.btn-ord:active{background:#E3F2FD;color:#1565C0;}
.ord-wrap{width:44px;display:flex;flex-direction:row;flex-shrink:0;border-left:1px solid #D0D0D0;}
.btn-add{padding:5px 10px;font-size:13px;cursor:pointer;user-select:none;width:100%;border-bottom:2px solid #D0D0D0;display:flex;align-items:center;min-height:30px;}
.tg-tog{width:24px;min-height:30px;cursor:pointer;font-size:13px;user-select:none;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.vr{color:#C00000!important;font-weight:700!important;}
.toast{position:fixed;top:46px;left:10px;right:10px;color:white;padding:8px 12px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:11px;white-space:pre-line;border-radius:2px;}
.sync-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#217346;color:white;font-size:10px;font-weight:700;margin-left:4px;animation:syncPulse 1.6s ease forwards;}
@keyframes syncPulse{0%{opacity:0;transform:scale(.4);}15%{opacity:1;transform:scale(1.3);}30%{transform:scale(1);}75%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(.85);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:white;border:2px solid #1F3864;padding:18px;width:100%;max-width:340px;box-shadow:4px 4px 0 #9E9E9E;}
.modal-title{font-weight:700;font-size:14px;color:#1F3864;margin-bottom:10px;border-bottom:2px solid #D9E1F2;padding-bottom:5px;}
.modal-info{font-size:13px;color:#444;margin-bottom:10px;line-height:1.5;}
.modal-select{width:100%;padding:8px;font-size:14px;font-family:'Roboto',sans-serif;border:1px solid #9E9E9E;background:white;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.btn1{background:#217346;color:white;border:none;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.btn2{background:#F2F2F2;color:#333;border:1px solid #9E9E9E;padding:8px 14px;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-container"></div>
<div id="toast-container"></div>
<script>
const CLIENT_ID='853385038024-h379oneaep6ikujs1v6o2qrfsb2skmp4.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
const FNAME='control-gastos-backup.json';
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const VER="v15";
const uid=()=>Math.random().toString(36).slice(2,10);
const PL=(a,m)=>`${MESES[m]} ${a}`;
const fmt=n=>new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(Number(n)||0);
const fmtUSD=n=>new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);

const MV=()=>({sueldo:0,extras:[],fijos:[],tarjetas:[
  {id:"tSAN",nombre:"VISA SANTANDER",cierre:"",venc:"",fpago:"",gastos:[],gastosUSD:[]},
  {id:"tVNA",nombre:"VISA NACIÓN",cierre:"",venc:"",fpago:"",gastos:[],gastosUSD:[]},
  {id:"tMNA",nombre:"MASTER NACIÓN",cierre:"",venc:"",fpago:"",gastos:[],gastosUSD:[]},
  {id:"tMAC",nombre:"VISA MACRO",cierre:"",venc:"",fpago:"",gastos:[],gastosUSD:[]},
]});

const ST={};let vistaAnual=false,anioAnual=new Date().getFullYear(),vistaAhorros=false,vistaPlani=false;
let PLANI={cols:['A','B','C','D'],rows:[['','','','']]};
try{const p=localStorage.getItem('planilla_data');if(p)PLANI=JSON.parse(p);}catch(e){}
function savePlani(){try{localStorage.setItem('planilla_data',JSON.stringify(PLANI));}catch(e){}}
let AHORROS=[];
try{const a=localStorage.getItem('ahorros_data');if(a)AHORROS=JSON.parse(a);}catch(e){}
function saveAhorros(){try{localStorage.setItem('ahorros_data',JSON.stringify(AHORROS));}catch(e){}}
let FIJOS={};
try{const f=localStorage.getItem('fijos_globales');if(f)FIJOS=JSON.parse(f);}catch(e){}
function saveFijos(){try{localStorage.setItem('fijos_globales',JSON.stringify(FIJOS));}catch(e){}}
function toggleFijo(id){FIJOS[id]=!FIJOS[id];if(!FIJOS[id])delete FIJOS[id];saveFijos();render();}
function esFijo(id){return!!FIJOS[id];}

// Verificados: gastos marcados como controlados contra resumen tarjeta
let VERIF={};
try{const v=localStorage.getItem('verificados');if(v)VERIF=JSON.parse(v);}catch(e){}
function saveVerif(){try{localStorage.setItem('verificados',JSON.stringify(VERIF));}catch(e){}}
function toggleVerif(id){VERIF[id]=!VERIF[id];if(!VERIF[id])delete VERIF[id];saveVerif();render();}
function esVerif(id){return!!VERIF[id];}

// Débitos automáticos
let DEBITOS={};
try{const d=localStorage.getItem('debitos_auto');if(d)DEBITOS=JSON.parse(d);}catch(e){}
function saveDebitos(){try{localStorage.setItem('debitos_auto',JSON.stringify(DEBITOS));}catch(e){}}
function toggleDebito(id){DEBITOS[id]=!DEBITOS[id];if(!DEBITOS[id])delete DEBITOS[id];saveDebitos();render();}
function esDebito(id){return!!DEBITOS[id];}

const HISTORY=[];
function pushHistory(){try{const snap=JSON.stringify(ST[`${anio}_${mesIdx}`]??MV());HISTORY.push({anio,mesIdx,data:snap});if(HISTORY.length>10)HISTORY.shift();}catch(e){}}
const PLANI_HISTORY=[];
function pushPlaniHistory(){try{PLANI_HISTORY.push(JSON.stringify(PLANI));if(PLANI_HISTORY.length>10)PLANI_HISTORY.shift();}catch(e){}}
function undoLast(){
  if(vistaPlani){
    if(!PLANI_HISTORY.length){toast('⚠ No hay cambios para deshacer','#7F4F00');return;}
    try{const last=JSON.parse(PLANI_HISTORY.pop());PLANI.cols=last.cols;PLANI.rows=last.rows;savePlani();renderPlani();toast('✓ Cambio deshecho','#217346');}
    catch(e){toast('⚠ Error al deshacer','#7F4F00');}
    return;
  }
  if(!HISTORY.length){toast('⚠ No hay cambios para deshacer','#7F4F00');return;}
  const last=HISTORY.pop();
  try{const d=JSON.parse(last.data);sST(last.anio,last.mesIdx,d);lSave(last.anio,last.mesIdx);dDebounce();render();toast('✓ Cambio deshecho','#217346');}
  catch(e){toast('⚠ Error al deshacer','#7F4F00');}
}

let _lp={anio:2026,mes:new Date().getMonth()};
let AUMENTOS={};
try{const a=localStorage.getItem('aumentos_sueldo');if(a)AUMENTOS=JSON.parse(a);}catch(e){}
function saveAumento(a,m,pct){AUMENTOS[`${a}_${m}`]=pct;try{localStorage.setItem('aumentos_sueldo',JSON.stringify(AUMENTOS));}catch(e){}}
function getAumento(a,m){return AUMENTOS[`${a}_${m}`]||0;}
try{const lp=localStorage.getItem('lastPeriod');if(lp){const p=JSON.parse(lp);_lp=p;}}catch(e){}
let anio=_lp.anio,mesIdx=_lp.mes,driveFileId=null,driveReady=false,accessToken=null,TExp={};
const gST=(a,m)=>ST[`${a}_${m}`]??null;
const sST=(a,m,d)=>{ST[`${a}_${m}`]=d;};
const gM=()=>gST(anio,mesIdx)??MV();
function sM(fn){pushHistory();const c=gM(),n=typeof fn==="function"?fn(c):fn;sST(anio,mesIdx,n);ST[`__ts_${anio}_${mesIdx}`]=Date.now();lSave(anio,mesIdx);dDebounce();render();}

const lKey=(a,m)=>`gastos_${VER}_${a}_${m}`;
function lSave(a,m){const d=ST[`${a}_${m}`];if(d)try{localStorage.setItem(lKey(a,m),JSON.stringify(d));}catch(e){}}
function lLoad(a,m){try{const r=localStorage.getItem(lKey(a,m));if(r){const d=JSON.parse(r);sST(a,m,d);return d;}}catch(e){}return null;}

let dTimer=null,lastSync=null,driveHint='';
try{const ls=localStorage.getItem('lastSync_v15');if(ls)lastSync=new Date(ls);}catch(e){}
try{const h=localStorage.getItem('drive_hint');if(h)driveHint=h;}catch(e){}

function fmtHora(d){if(!d)return'nunca';return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}

function updateDriveBar(){
  const gb=document.getElementById('drive-bar');if(!gb)return;gb.innerHTML='';
  const tw=document.createElement('div');tw.style.cssText='display:flex;flex-direction:column;gap:1px;margin-right:2px;';
  const tt=document.createElement('span');tt.style.cssText='font-size:9px;font-weight:700;color:#217346;white-space:nowrap;letter-spacing:.5px;';tt.textContent='📊 CONTROL DE GASTOS';
  tw.appendChild(tt);
  const statusRow=document.createElement('div');statusRow.style.cssText='display:flex;align-items:center;gap:6px;';
  if(!driveReady){
    const info=document.createElement('span');info.style.cssText='color:#555;font-size:11px;white-space:nowrap;';info.textContent='💾 Datos locales';
    statusRow.appendChild(info);tw.appendChild(statusRow);
    const cb=document.createElement('button');cb.className='gbtn blue';cb.textContent='SYNC';cb.onclick=cDrive;
    gb.append(tw,cb);
  }else{
    const info=document.createElement('span');info.style.cssText='color:#375623;font-size:11px;white-space:nowrap;';info.textContent='✓ Drive';
    const si=document.createElement('span');si.className='sync-time-anchor';si.style.cssText='color:#666;font-size:11px;white-space:nowrap;';si.textContent='Sync: '+fmtHora(lastSync);
    statusRow.append(info,si);tw.appendChild(statusRow);
    const gs=document.createElement('button');gs.className='gbtn green';gs.textContent='SYNC';gs.onclick=dSaveAll;
    gb.append(tw,gs);
  }
  const ub=document.createElement('button');ub.className='gbtn';ub.style.cssText='background:#7F6000;font-size:22px;';ub.textContent='↺';ub.title='Deshacer';ub.onclick=undoLast;
  const dl=document.createElement('button');dl.className='gbtn navy';dl.textContent='⬇ CSV';dl.onclick=dlCSV;
  const vG=document.createElement('button');vG.className='gbtn';vG.style.cssText=`background:${!vistaAnual&&!vistaAhorros&&!vistaPlani?'#217346':'#9E9E9E'};font-size:11px;`;vG.textContent='GASTOS';vG.onclick=()=>{vistaAnual=false;vistaAhorros=false;vistaPlani=false;render();};
  const vA=document.createElement('button');vA.className='gbtn';vA.style.cssText=`background:${vistaAnual?'#1F3864':'#9E9E9E'};font-size:11px;`;vA.textContent='ANUAL';vA.onclick=()=>{vistaAnual=true;vistaAhorros=false;vistaPlani=false;anioAnual=anio;renderAnual();};
  const vAh=document.createElement('button');vAh.className='gbtn';vAh.style.cssText=`background:${vistaAhorros?'#006994':'#9E9E9E'};font-size:11px;`;vAh.textContent='CALC';vAh.onclick=()=>{vistaAhorros=true;vistaAnual=false;vistaPlani=false;renderAhorros();};
  const vPl=document.createElement('button');vPl.className='gbtn';vPl.style.cssText=`background:${vistaPlani?'#5C3D2E':'#9E9E9E'};font-size:11px;`;vPl.textContent='NOTAS';vPl.onclick=()=>{vistaPlani=true;vistaAhorros=false;vistaAnual=false;renderPlani();};
  gb.append(ub,dl,vG,vA,vAh,vPl);
}

function dDebounce(){if(!driveReady)return;clearTimeout(dTimer);dTimer=setTimeout(dSaveAll,3000);}

async function dSaveAll(){
  if(!driveReady||!accessToken)return;
  const calcD=JSON.parse(localStorage.getItem('calc_diario')||'{}');
  const calcU=JSON.parse(localStorage.getItem('calc_uva')||'{}');
  const backup={...ST, __fijos:FIJOS, __verif:VERIF, __debitos:DEBITOS, __aumentos:AUMENTOS, __ahorros:AHORROS, __calcD:calcD, __calcU:calcU, __plani:PLANI};
  const body=JSON.stringify(backup);
  try{
    if(driveFileId){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body});}
    else{
      const meta=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({name:FNAME,mimeType:'application/json'})}).then(r=>r.json());
      driveFileId=meta.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body});
    }
    lastSync=new Date();try{localStorage.setItem('lastSync_v15',lastSync.toISOString());}catch(e){}
    updateDriveBar();pulseSyncIcon();
  }catch(e){toast('⚠ Error al guardar en Drive','#7F4F00');}
}

async function dLoad(){
  if(!accessToken)return;
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FNAME}'&spaces=drive&fields=files(id,name)`,{headers:{'Authorization':'Bearer '+accessToken}}).then(r=>r.json());
    if(r.files&&r.files.length>0){
      driveFileId=r.files[0].id;
      const dd=await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{'Authorization':'Bearer '+accessToken}}).then(r=>r.json());
      // Restaurar marcadores globales desde Drive
      if(dd.__fijos){try{Object.assign(FIJOS,dd.__fijos);localStorage.setItem('fijos_globales',JSON.stringify(FIJOS));}catch(e){}}
      if(dd.__verif){try{Object.assign(VERIF,dd.__verif);localStorage.setItem('verificados',JSON.stringify(VERIF));}catch(e){}}
      if(dd.__debitos){try{Object.assign(DEBITOS,dd.__debitos);localStorage.setItem('debitos_auto',JSON.stringify(DEBITOS));}catch(e){}}
      if(dd.__aumentos){try{Object.assign(AUMENTOS,dd.__aumentos);localStorage.setItem('aumentos_sueldo',JSON.stringify(AUMENTOS));}catch(e){}}
      if(dd.__ahorros){try{AHORROS.length=0;dd.__ahorros.forEach(a=>AHORROS.push(a));localStorage.setItem('ahorros_data',JSON.stringify(AHORROS));}catch(e){}}
      if(dd.__calcD){try{localStorage.setItem('calc_diario',JSON.stringify(dd.__calcD));}catch(e){}}
      if(dd.__calcU){try{localStorage.setItem('calc_uva',JSON.stringify(dd.__calcU));}catch(e){}}
      if(dd.__plani){try{Object.assign(PLANI,dd.__plani);localStorage.setItem('planilla_data',JSON.stringify(PLANI));}catch(e){}}
      // Merge datos de meses
      const skipKeys=new Set(['__fijos','__verif','__debitos']);
      const all=new Set([...Object.keys(dd).filter(k=>!k.startsWith('__ts_')&&!skipKeys.has(k)),...Object.keys(ST).filter(k=>!k.startsWith('__ts_'))]);
      all.forEach(k=>{const tk=`__ts_${k}`;const lt=ST[tk]||0;const dt=dd[tk]||0;if(dt>lt){if(dd[k]!==undefined){ST[k]=dd[k];ST[tk]=dt;}}else if(!lt&&!dt){if(dd[k]!==undefined)ST[k]=dd[k];}});
      Object.keys(ST).forEach(k=>{if(!k.startsWith('__ts_')){const p=k.split('_');if(p.length>=2)try{localStorage.setItem(lKey(p[0],p[1]),JSON.stringify(ST[k]));}catch(e){}}});
      render();pulseSyncIcon();
    }else{await dSaveAll();}
  }catch(e){toast('⚠ Error al cargar desde Drive','#7F4F00');}
}

function initGA(){
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
  s.onload=()=>{
    window.tC=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,login_hint:driveHint||undefined,
      callback:(r)=>{if(r.access_token){accessToken=r.access_token;driveReady=true;
        if(!driveHint){fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+r.access_token}}).then(res=>res.json()).then(info=>{if(info.email){driveHint=info.email;try{localStorage.setItem('drive_hint',info.email);}catch(e){}}}).catch(()=>{});}
        dLoad();render();setTimeout(updateDriveBar,200);}}});
    mostrarModalSync();
  };
  document.head.appendChild(s);
}
function cDrive(){if(window.tC)window.tC.requestAccessToken();}

function mostrarModalSync(){
  const mc=document.getElementById('modal-container');
  mc.innerHTML=`<div class="modal-overlay"><div class="modal-box" style="text-align:center;">
    <div style="font-size:28px;margin-bottom:8px;">☁️</div>
    <div class="modal-title" style="text-align:center;font-size:15px;">CONTROL DE GASTOS</div>
    <div class="modal-info" style="text-align:center;margin-bottom:16px;">¿Sincronizar con Google Drive antes de comenzar?</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn1" id="btn-sync-init" style="width:100%;padding:10px;">☁ Sincronizar con Drive</button>
      <button class="btn2" id="btn-nosync-init" style="width:100%;padding:10px;">Continuar sin sincronizar</button>
    </div></div></div>`;
  document.getElementById('btn-sync-init').onclick=()=>{closeModal();cDrive();};

function actualizarMesFecha(fecha, mesDestino){
  // fecha: "28/06", mesDestino: 0-11
  if(!fecha||!fecha.trim())return '';
  const m=fecha.match(/^(\d{2})\/(\d{2})$/);
  if(!m)return fecha;
  const dia=m[1];
  const mesStr=String(mesDestino+1).padStart(2,'0');
  return `${dia}/${mesStr}`;
}

function parseFecha(raw){
  if(!raw||!raw.trim())return{ok:true,val:''};
  let s=raw.trim(),dia,mes;
  const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})$/);const m2=s.match(/^(\d{2})(\d{2})$/);
  if(m1){dia=parseInt(m1[1]);mes=parseInt(m1[2]);}else if(m2){dia=parseInt(m2[1]);mes=parseInt(m2[2]);}else return{ok:false,val:''};
  if(dia<1||dia>31||mes<1||mes>12)return{ok:false,val:''};
  return{ok:true,val:String(dia).padStart(2,'0')+'/'+String(mes).padStart(2,'0')};
}

function mkFecha(val,onChange,celda){
  const div=document.createElement('div');div.className='cv';div.dataset.celda=celda;

  refresh();

    inp.type='text';inp.value=val||'';inp.placeholder='dd/mm';
    inp.style.cssText="width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;padding:0 5px;height:30px;";
    div.appendChild(inp);setTimeout(()=>{inp.focus();inp.select();},50);

    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){div.innerHTML='';refresh();}});
  });
  return div;
}

async function replic({tipo,periodos,itemId,tarjetaId}){
  const o=gM();let payload;
  if(tipo==="sueldo")payload=o.sueldo;
  else if(tipo==="extra")payload=o.extras.find(e=>e.id===itemId);
  else if(tipo==="fijo")payload=o.fijos.find(f=>f.id===itemId);
  else if(tipo==="tarjetaGasto"){const t=o.tarjetas.find(t=>t.id===tarjetaId);payload=t?.gastos.find(g=>g.id===itemId);}
  if(!payload&&payload!==0)return{ok:0,conf:["Ítem no encontrado"]};
  const conf=[];let ok=0;
  for(let i=0;i<periodos.length;i++){
    const{anio:a,mes:m}=periodos[i];if(!gST(a,m))lLoad(a,m);
    let d=gST(a,m)??MV();let mod=false;const lb=PL(a,m);
    if(tipo==="sueldo"){if(d.sueldo!==0&&d.sueldo!==payload)conf.push(`${lb}: Sueldo ya tiene $${fmt(d.sueldo)}`);else{d.sueldo=payload;mod=true;}}
    else if(tipo==="extra"){const idx=d.extras.findIndex(e=>e.id===itemId);if(idx!==-1){if(d.extras[idx].importe!==0&&d.extras[idx].importe!==payload.importe)conf.push(`${lb}: "${payload.concepto}" ya tiene $${fmt(d.extras[idx].importe)}`);else{d.extras[idx]={...d.extras[idx],...payload};mod=true;}}else{d.extras.push({...payload,id:uid()});mod=true;}}
    else if(tipo==="fijo"){const idx=d.fijos.findIndex(f=>f.id===itemId);if(idx!==-1){if(d.fijos[idx].importe!==0&&d.fijos[idx].importe!==payload.importe)conf.push(`${lb}: "${payload.concepto}" ya tiene $${fmt(d.fijos[idx].importe)}`);else{d.fijos[idx]={...d.fijos[idx],...payload,venc:actualizarMesFecha(payload.venc,m),fpago:actualizarMesFecha(payload.fpago,m)};mod=true;}}else{d.fijos.push({...payload,id:uid(),venc:actualizarMesFecha(payload.venc,m),fpago:actualizarMesFecha(payload.fpago,m)});mod=true;}}
    else if(tipo==="tarjetaGasto"){
      let ti=d.tarjetas.findIndex(t=>t.id===tarjetaId);
      if(ti===-1){d.tarjetas.push({id:tarjetaId,nombre:tarjetaId,cierre:"",venc:"",fpago:"",gastos:[]});ti=d.tarjetas.length-1;}
      const cn=1+(i+1);const dup=d.tarjetas[ti].gastos.find(g=>g.cuotaOrigen===itemId);
      if(dup&&dup.importe!==0)conf.push(`${lb}: "${payload.concepto}" cuota ${cn}/${payload.cuotaTotal} ya existe`);
      else{d.tarjetas[ti].gastos=d.tarjetas[ti].gastos.filter(g=>g.cuotaOrigen!==itemId);d.tarjetas[ti].gastos.push({id:uid(),concepto:payload.concepto,importe:payload.importe,cuotaTotal:payload.cuotaTotal,cuotaNum:cn,cuotaOrigen:itemId});mod=true;}
    }
    if(mod){sST(a,m,d);lSave(a,m);ok++;}
  }
  if(driveReady)dDebounce();return{ok,conf};
}

async function eliminarPropagadas(tarjetaId,origenId,desdeMes,desdeAnio){
  for(let i=1;i<=36;i++){
    let nm=desdeMes+i,na=desdeAnio;if(nm>11){na+=Math.floor(nm/12);nm=nm%12;}
    if(!gST(na,nm))lLoad(na,nm);const d=gST(na,nm);if(!d)continue;
    const ti=d.tarjetas?.findIndex(t=>t.id===tarjetaId)??-1;if(ti===-1)continue;
    const antes=d.tarjetas[ti].gastos.length;
    d.tarjetas[ti].gastos=d.tarjetas[ti].gastos.filter(g=>g.cuotaOrigen!==origenId);
    if(d.tarjetas[ti].gastos.length!==antes){sST(na,nm,d);lSave(na,nm);}
  }
  if(driveReady)dDebounce();
}

    (anterior.fijos||[]).forEach(f=>{

          {w:90,bg:rbg,node:prop?(()=>{const d=E('div','cv');d.style.color='#A07050';d.textContent=fmt(g.importe);return d;})():mkCell(g.importe,v=>uG(ti,gi,'importe',Number(v)||0),{type:'number',celda:`tg${ti}-${gi}i`})},
          {w:58,bg:rbg,node:prop?(()=>{const d=E('div','cv');d.style.color='#A07050';d.textContent=g.cuotaTotal;return d;})():mkCell(g.cuotaTotal||1,v=>{const nv=Math.max(1,Number(v)||1);uG(ti,gi,'cuotaTotal',nv);if(nv>1)setTimeout(()=>autoReplicarCuotas(ti,gi),300);},{type:'number',celda:`tg${ti}-${gi}ct`})},
          {w:48,bg:rbg,node:(()=>{const d=E('div','cv');d.style.cssText=`justify-content:center;color:${esC?'#833C00':'#AAA'};font-weight:${esC?700:400};cursor:default;`;d.textContent=esC?`${g.cuotaNum}/${g.cuotaTotal}`:'–';return d;})()},
          {w:26,bg:rbg,node:(!prop&&Number(g.cuotaTotal)<=1)?repB(()=>openModal('tarjetaGasto',`${g.concepto||'(SIN NOMBRE)'}`,g.id,t.id,1)):E('div')},
          {w:26,bg:rbg,node:delB(()=>confirmarEliminar(`¿Eliminar "${g.concepto||'este gasto'}"?`+((!prop&&g.cuotaTotal>1)?' Se eliminarán las cuotas siguientes.':''),async()=>{
            sM(m=>{const a=[...m.tarjetas];a[ti]={...a[ti],gastos:(a[ti].gastos||[]).filter((_,j)=>j!==gi)};return{...m,tarjetas:a};});
            if(!prop&&g.cuotaTotal>1&&g.id){await eliminarPropagadas(t.id,g.id,mesIdx,anio);toast('✓ Cuotas eliminadas','#217346');}
          }))},
          {w:44,bg:rbg,node:mkOrdCol(
            ()=>{if(gi>0)sM(m=>{const a=[...m.tarjetas],gs=[...(a[ti].gastos||[])];[gs[gi-1],gs[gi]]=[gs[gi],gs[gi-1]];a[ti]={...a[ti],gastos:gs};return{...m,tarjetas:a};});},
            ()=>{sM(m=>{const a=[...m.tarjetas],gs=[...(a[ti].gastos||[])];if(gi<gs.length-1){[gs[gi],gs[gi+1]]=[gs[gi+1],gs[gi]];}a[ti]={...a[ti],gastos:gs};return{...m,tarjetas:a};});}
          )},
        ],'1px solid #EEE');
        tbl.appendChild(filaG);
      });

      // Subtotales cuotas vs corrientes
      const totCuotas=(t.gastos||[]).filter(g=>Number(g.cuotaTotal)>1).reduce((s,g)=>s+(Number(g.importe)||0),0);
      const totCorrientes=(t.gastos||[]).filter(g=>Number(g.cuotaTotal)<=1).reduce((s,g)=>s+(Number(g.importe)||0),0);
      if(totCuotas>0&&totCorrientes>0){
        tbl.appendChild(mkRow([
          {w:24,bg:'#FFF5EE',node:E('div')},
          {w:24,bg:'#FFF5EE',node:E('div')},
          {w:160,bg:'#FFF5EE',node:(()=>{const d=E('div','lbl');d.style.cssText='color:#833C00;font-style:italic;font-size:12px;';d.textContent='En cuotas:';return d;})()},
          {w:90,bg:'#FFF5EE',node:(()=>{const d=E('div','val');d.style.cssText='color:#833C00;font-size:12px;';d.textContent=fmt(totCuotas);return d;})()},
          {grow:true,bg:'#FFF5EE',node:E('div')},
        ],'1px solid #F0D0C0'));
        tbl.appendChild(mkRow([
          {w:24,bg:'#FFF5EE',node:E('div')},
          {w:24,bg:'#FFF5EE',node:E('div')},
          {w:160,bg:'#FFF5EE',node:(()=>{const d=E('div','lbl');d.style.cssText='color:#833C00;font-style:italic;font-size:12px;';d.textContent='Corrientes:';return d;})()},
          {w:90,bg:'#FFF5EE',node:(()=>{const d=E('div','val');d.style.cssText='color:#833C00;font-size:12px;';d.textContent=fmt(totCorrientes);return d;})()},
          {grow:true,bg:'#FFF5EE',node:E('div')},
        ],'1px solid #F0D0C0'));
      }
      const rowG=E('div');rowG.style.cssText='display:flex;border-bottom:1px solid #DDD;';
      const paddG=E('div');paddG.style.cssText='width:48px;flex-shrink:0;';
      const btnAG=E('div','btn-add');btnAG.style.cssText='color:#A0522D;background:#FFF5EE;flex:1;';btnAG.textContent='+ Agregar gasto';btnAG.onclick=()=>addG(ti);
      const btnAGU=E('div','btn-add');btnAGU.style.cssText='color:#1565C0;background:#E3F2FD;border-left:1px solid #90CAF9;flex:1;justify-content:center;';btnAGU.textContent='+ USD';btnAGU.onclick=()=>addGUSD(ti);
      const btnTG=E('div','btn-add');btnTG.style.cssText='color:#375623;background:#E2EFDA;border-left:1px solid #C6E0B4;flex:1;justify-content:center;';btnTG.textContent='☑ Traer fijos';btnTG.onclick=()=>traerFijosTarjeta(t.id);
      rowG.append(paddG,btnAG,btnAGU,btnTG);tbl.appendChild(rowG);

      // Gastos en USD
      if((t.gastosUSD||[]).length>0){
        tbl.appendChild(mkRow([
          {w:24,bg:'#E3F2FD',node:E('div')},{w:26,bg:'#E3F2FD',node:E('div')},
          {w:160,bg:'#E3F2FD',node:thN('Concepto USD')},
          {w:90,bg:'#E3F2FD',node:thN('Monto USD')},
          {w:26,bg:'#E3F2FD',node:E('div')},
          {w:26,bg:'#E3F2FD',node:E('div')},
          {w:26,bg:'#E3F2FD',node:E('div')},
        ],'1px solid #90CAF9'));
        (t.gastosUSD||[]).forEach((g,gi)=>{
          const rbgU=gi%2===0?'#F8FBFF':'#EEF6FF';
          const vU=esVerif('usd_'+g.id);
          const btnVU=(()=>{const d=E('div');d.style.cssText=`width:26px;min-height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;background:${vU?'#FFD700':'transparent'};color:${vU?'#5C4000':'#CCC'};`;d.textContent='✓';d.onclick=()=>toggleVerif('usd_'+g.id);return d;})();
          // Replicar gasto USD a meses siguientes
          const replUSD=()=>{
            const tarjetaId=t.id;
            const gConcepto=g.concepto;
            const gImporte=g.importe;
            const ps=pSig(anio,mesIdx);
            const opts=ps.map((p,i)=>`<option value="${i}">${PL(p.anio,p.mes)}</option>`).join('');
            const mc=document.getElementById('modal-container');
            mc.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">
              <div class="modal-title">Replicar USD: ${g.concepto||'(SIN NOMBRE)'}</div>
              <div class="modal-info">Desde <b>${PL(anio,mesIdx)}</b> hasta:</div>
              <select id="hsel-usd" class="modal-select">${opts}</select>
              <div class="modal-btns">
                <button class="btn2" id="btn-cancel-usd">Cancelar</button>
                <button class="btn1" id="btn-rep-usd">Replicar →</button>
              </div></div></div>`;
            document.getElementById('btn-cancel-usd').onclick=()=>closeModal();
            document.getElementById('btn-rep-usd').onclick=()=>{
              const selVal=Number(document.getElementById('hsel-usd')?.value||0);
              closeModal();
              const sel=ps.slice(0,selVal+1);
              let ok=0;
              sel.forEach(({anio:a,mes:m})=>{
                if(!gST(a,m))lLoad(a,m);
                const d=gST(a,m)??MV();
                const ti2=d.tarjetas.findIndex(t2=>t2.id===tarjetaId);
                if(ti2!==-1){
                  if(!d.tarjetas[ti2].gastosUSD)d.tarjetas[ti2].gastosUSD=[];
                  const existe=d.tarjetas[ti2].gastosUSD.find(x=>x.concepto===gConcepto);
                  if(!existe){d.tarjetas[ti2].gastosUSD.push({id:uid(),concepto:gConcepto,importe:gImporte});sST(a,m,d);lSave(a,m);ok++;}
                }
              });
              if(driveReady)dDebounce();
              toast('✓ Replicado en '+ok+' período'+(ok!==1?'s':''),'#217346');
            };
          };
          const vDA=esDebito('usd_'+g.id);
          const rbgU2=vU?'#FFFDE7':vDA?'#F0FFF0':rbgU;
          const btnDAU=(()=>{const d=E('div');d.style.cssText=`width:26px;min-height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:700;flex-shrink:0;background:${vDA?'#217346':'transparent'};color:${vDA?'white':'#CCC'};`;d.textContent='DA';d.onclick=()=>toggleDebito('usd_'+g.id);return d;})();
          tbl.appendChild(mkRow([
            {w:24,bg:rbgU2,node:E('div')},
            {w:26,bg:vU?'#FFD700':'transparent',node:btnVU},
            {w:26,bg:vDA?'#217346':'transparent',node:btnDAU},
            {w:160,bg:vU?'#FFFDE7':rbgU,node:mkCell(g.concepto,v=>uGUSD(ti,gi,'concepto',v),{placeholder:'CONCEPTO',celda:`usd${ti}-${gi}c`})},
            {w:90,bg:vU?'#FFFDE7':rbgU,node:(()=>{
            // Celda con decimales para USD
            const val=g.importe;
            const div=E('div','cv');div.dataset.celda=`usd${ti}-${gi}i`;div.style.color='#1565C0';
            div.textContent=val&&val!==0?fmtUSD(val):'';
            div.addEventListener('click',()=>{
              div.innerHTML='';const inp=document.createElement('input');
              inp.type='number';inp.step='0.01';inp.value=val||'';inp.placeholder='0.00';
              inp.style.cssText="width:100%;border:none;outline:none;background:#FFF9C4;font-size:13px;padding:0 5px;height:30px;color:#1565C0;";
              div.appendChild(inp);setTimeout(()=>{inp.focus();inp.select();},50);
              inp.addEventListener('blur',()=>{const nv=inp.value===''?0:Number(inp.value);uGUSD(ti,gi,'importe',nv);});
              inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}if(e.key==='Escape')render();});
            });
            return div;
          })()},
            {w:26,bg:vU?'#FFFDE7':rbgU,node:repB(()=>replUSD())},
            {w:26,bg:vU?'#FFFDE7':rbgU,node:delB(()=>confirmarEliminar(`¿Eliminar "${g.concepto||'este gasto USD'}"?`,()=>sM(m=>{const a=[...m.tarjetas];a[ti]={...a[ti],gastosUSD:(a[ti].gastosUSD||[]).filter((_,j)=>j!==gi)};return{...m,tarjetas:a};})))},
          ],'1px solid #BBDEFB'));
        });
      }
    }
  });
  tbl.appendChild(addB('+ Agregar tarjeta','#833C00','#FFF5EE',()=>sM(m=>({...m,tarjetas:[...m.tarjetas,{id:uid(),nombre:'',cierre:'',venc:'',fpago:'',gastos:[]}]}))));
}

lLoad(anio,mesIdx);
initGA();
render();
</script>
</body>
</html>
